name: Bug Report
description: Report a reproducible bug or unexpected behavior
labels: ["type: bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to file a bug report. Please fill out as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Run `npx env-typegen ...`
        2. Open the generated file
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - env-typegen package (CLI or API)
        - Documentation site
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: env-typegen version
      description: Output of `npx env-typegen --version`, or the version in your package.json.
      placeholder: e.g. 0.3.0
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: e.g. v22.12.0
    validations:
      required: true

  - type: textarea
    id: env-example
    attributes:
      label: .env.example that reproduces it
      description: A minimal file, with secrets removed.
      render: env
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, package manager, framework, etc.
    validations:
      required: false
