name: Release

on:
  push:
    branches: [main]

permissions: read-all

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @xlameiro/env-typegen lint
      - run: pnpm --filter @xlameiro/env-typegen type-check
      - run: pnpm --filter @xlameiro/env-typegen test:coverage
      - run: pnpm --filter @xlameiro/env-typegen build
      - run: pnpm --filter @xlameiro/env-typegen release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          HUSKY: 0
